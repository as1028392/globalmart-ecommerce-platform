<!DOCTYPE html>
<html lang="ar" dir="rtl" id="app-html">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Global Mart | Login & Register</title>
</head>

<body>

    <div class="lang-switcher">
        <button id="lang-btn" onclick="toggleLanguage()">English</button>
    </div>

    <div class="container" id="container">
        <div class="form-container sign-up">
            <form onsubmit="event.preventDefault();">
                <h1 id="txt-create-account">إنشاء حساب جديد</h1>
                <div class="social-icons">
                    <a href="#" class="icon"><i class="fa-brands fa-google"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-vk"></i></a>
                </div>
                <span id="txt-use-phone-signup">أو استخدم رقم جوالك للتسجيل</span>
                <input type="text" id="input-name" placeholder="الاسم الكامل" required>
                <input type="tel" id="input-phone-signup" placeholder="رقم الجوال (مثال: 010XXXXXXXX)" required>
                <input type="password" id="input-pass-signup" placeholder="كلمة المرور" required>
                <button id="btn-signup-submit">إنشاء الحساب</button>
            </form>
        </div>

        <div class="form-container sign-in">
            <form onsubmit="event.preventDefault();">
                <h1 id="txt-signin-title">تسجيل الدخول</h1>
                <div class="social-icons">
                    <a href="#" class="icon"><i class="fa-brands fa-google"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-vk"></i></a>
                </div>
                <span id="txt-use-phone-signin">أو ادخل باستخدام رقم الجوال وكلمة المرور</span>
                <input type="tel" id="input-phone-signin" placeholder="رقم الجوال" required>
                <input type="password" id="input-pass-signin" placeholder="كلمة المرور" required>
                <a href="#" id="txt-forget-pass">هل نسيت كلمة المرور؟</a>
                <button id="btn-signin-submit">تسجيل الدخول</button>
            </form>
        </div>

        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1 id="txt-welcome-back">مرحباً بك مجدداً!</h1>
                    <p id="txt-welcome-desc">لتظل على اتصال معنا، يرجى تسجيل الدخول ببياناتك الشخصية</p>
                    <button class="hidden" id="login">تسجيل الدخول</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1 id="txt-hello-friend">أهلاً بك يا صديقنا!</h1>
                    <p id="txt-hello-desc">أدخل بياناتك الشخصية وابدأ رحلة التسوق العالمي معنا الآن</p>
                    <button class="hidden" id="register">إنشاء حساب</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
